<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Detail Learning Path</title>

    <link rel="stylesheet" href="../global.css" />

    <style>
      body {
        background: #f8fbff;
        padding: 50px;
      }

      .cd-detail {
        max-width: 1000px;
        margin: auto;
        background: white;
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.06);
      }

      .cd-title {
        font-size: 42px;
        margin-bottom: 12px;
      }

      .cd-desc {
        color: #64748b;
        line-height: 1.8;
        margin-bottom: 30px;
      }

      .cd-meta {
        display: flex;
        gap: 24px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .cd-roadmap {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .cd-roadmap span {
        padding: 14px 22px;
        background: #eef2ff;
        border-radius: 999px;
        font-weight: 700;
      }

      .cd-back {
        display: inline-block;
        margin-top: 40px;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 14px;
        background: #2563eb;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="cd-detail">
      <h1 class="cd-title" id="title"></h1>

      <p class="cd-desc" id="desc"></p>

      <div class="cd-meta" id="meta"></div>

      <h2>Roadmap Belajar</h2>

      <div class="cd-roadmap" id="roadmap"></div>
      <div id="materials"></div>

      <a href="learning-path.html" class="cd-back"> ← Kembali </a>
    </div>
    <script src="learning-path-detail.js"></script>
  </body>
</html>
